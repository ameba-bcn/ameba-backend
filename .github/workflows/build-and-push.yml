name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ameba-backend

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker compose build

      - name: Run Tests
        run: |
          docker compose run --rm ameba-backend python manage.py compilemessages
          docker compose run --rm ameba-backend python manage.py collectstatic --noinput
          docker compose run --rm ameba-backend python manage.py migrate --noinput
          docker compose run --rm ameba-backend python manage.py test --noinput

      - name: Tag and Push Image
        if: success()
        run: |
          LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # Lógica de etiquetado: main -> latest, dev -> dev
          if [ "${{ github.ref_name }}" = "main" ]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          
          TARGET_IMAGE="${{ env.REGISTRY }}/${LOWERCASE_REPO}:${IMAGE_TAG}"
          SOURCE_IMAGE_ID=$(docker images -q ameba-backend)
          
          if [ -z "$SOURCE_IMAGE_ID" ]; then
            echo "Error: No se encontró imagen para el servicio ameba-backend."
            exit 1
          fi

          echo "Tagging image $SOURCE_IMAGE_ID as $TARGET_IMAGE"
          docker tag "$SOURCE_IMAGE_ID" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

  deploy-dev:
    name: Deploy to dev
    needs: build-test-push
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            cd ~/ameba-devops
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            docker compose up -d --force-recreate ameba-backend
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployed to dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to prod
    needs: build-test-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Deploy to prod Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd ~/ameba-devops
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose up -d --force-recreate ameba-backend
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployed to prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: prod" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY